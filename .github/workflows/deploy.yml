name: Deploy PdfCraft to Cloudflare Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. 扩容 10GB 虚拟内存，避免 OOM 闪退 (Exit code 143)
      - name: Expand Swap Space (Fix OOM Exit Code 143)
        run: |
          echo "=== 扩容前内存状况 ==="
          free -h
          sudo swapoff -a || true
          sudo fallocate -l 10G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=10240
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo "=== 扩容后内存状况 ==="
          free -h

      # 2. 安装 Rust 工具链与 Wasm 目标平台
      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # 3. Rust 依赖与编译缓存加速
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      # 4. 安装兼容版 Trunk
      - name: Install Trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.20.3

      # 5. 安装现代 Binaryen (wasm-opt v122) 并创建 SIMD Wrapper
      - name: Install Modern Binaryen & Setup SIMD Wrapper
        run: |
          curl -fsSL https://github.com/WebAssembly/binaryen/releases/download/version_122/binaryen-version_122-x86_64-linux.tar.gz | tar -xz
          sudo cp binaryen-version_122/bin/* /usr/local/bin/
          
          sudo mv /usr/local/bin/wasm-opt /usr/local/bin/wasm-opt-raw
          printf '#!/bin/bash\nexec /usr/local/bin/wasm-opt-raw --all-features --enable-simd "$@"\n' | sudo tee /usr/local/bin/wasm-opt > /dev/null
          sudo chmod +x /usr/local/bin/wasm-opt
          wasm-opt --version

      # 6. 配置 Fat LTO 极致压缩并深度修改底层默认中文
      - name: Optimize Profile and Set Chinese Default
        run: |
          find . -name "Trunk.toml" -exec sed -i 's/wasm_opt = true/wasm_opt = false/g' {} + || true
          find . -name "Trunk.toml" -exec sed -i 's/wasm_opt = "z"/wasm_opt = false/g' {} + || true
          find . -name "*.html" -exec sed -i 's/data-wasm-opt="z"/data-wasm-opt="0"/g' {} + || true

          cat << 'PYEOF' > patch_chinese.py
          import os, re

          # 1. 注入 Fat LTO 极致体积配置
          cargo_file = "Cargo.toml"
          if os.path.exists(cargo_file):
              with open(cargo_file, "r", encoding="utf-8") as f:
                  lines = f.readlines()
              
              filtered = []
              skip = False
              for line in lines:
                  if line.strip().startswith("[profile.release"):
                      skip = True
                      continue
                  if skip and line.strip().startswith("["):
                      skip = False
                  if not skip:
                      filtered.append(line)

              opt_profile = (
                  "\n[profile.release]\n"
                  'opt-level = "z"\n'
                  'lto = "fat"\n'
                  "codegen-units = 1\n"
                  'panic = "abort"\n'
                  "strip = true\n"
                  "debug = 0\n"
              )
              filtered.append(opt_profile)

              with open(cargo_file, "w", encoding="utf-8") as f:
                  f.writelines(filtered)
              print("✅ Cargo.toml 已更新为 Fat LTO 极致压缩配置")

          # 2. 深度穿透扫描所有 Rust 源码，全面修改默认语言为中文
          for root, _, files in os.walk("."):
              if any(k in root for k in ["target", ".git", "dist"]):
                  continue
              for file in files:
                  if file.endswith(".rs"):
                      path = os.path.join(root, file)
                      try:
                          with open(path, "r", encoding="utf-8") as f:
                              code = f.read()
                          orig = code

                          code = code.replace('"en-US"', '"zh-CN"')
                          code = code.replace('"en_US"', '"zh_CN"')
                          code = re.sub(r'const\s+DEFAULT_LANG(?:UAGE)?:\s*&str\s*=\s*"en";', 'const DEFAULT_LANGUAGE: &str = "zh";', code)
                          code = re.sub(r'const\s+FALLBACK_LANG(?:UAGE)?:\s*&str\s*=\s*"en";', 'const FALLBACK_LANGUAGE: &str = "zh";', code)
                          code = re.sub(r'const\s+ENGLISH_ID:\s*&str\s*=\s*"en";', 'const ENGLISH_ID: &str = "zh";', code)
                          code = re.sub(r'language:\s*String\s*=\s*"system"\.into\(\)', 'language: String = "zh".into()', code)
                          code = re.sub(r'language:\s*String\s*=\s*"en"[^;]*;', 'language: String = "zh".into();', code)
                          code = re.sub(r'locale:\s*String\s*=\s*"en"[^;]*;', 'locale: String = "zh".into();', code)

                          if "enum Language" in code or "Language::English" in code:
                              for target in ["Language::Chinese", "Language::Zh", "Language::ZhHans", "Language::SimplifiedChinese"]:
                                  if target in code:
                                      code = re.sub(r'impl\s+Default\s+for\s+Language\s*\{[^}]*English[^}]*\}', f'impl Default for Language {{\n    fn default() -> Self {{\n        {target}\n    }}\n}}', code)
                                      code = code.replace("Language::English", target)
                                      break

                          if code != orig:
                              with open(path, "w", encoding="utf-8") as f:
                                  f.write(code)
                              print(f"Patched default language to Chinese in {path}")
                      except Exception:
                          pass

          # 3. 在 index.html 中注入浏览器语言劫持代码
          target_html = "apps/pdfcraft-web/index.html"
          if os.path.exists(target_html):
              with open(target_html, "r", encoding="utf-8") as f:
                  html = f.read()

              hook_script = (
                  "<script>\n"
                  "try {\n"
                  "  Object.defineProperty(navigator, 'language', { get: function() { return 'zh-CN'; } });\n"
                  "  Object.defineProperty(navigator, 'languages', { get: function() { return ['zh-CN', 'zh']; } });\n"
                  "  ['pdfcraft_language', 'language', 'locale', 'app_lang'].forEach(function(k) {\n"
                  "    localStorage.setItem(k, 'zh');\n"
                  "  });\n"
                  "} catch(e) {}\n"
                  "</script>\n"
              )
              if "<head>" in html and "Object.defineProperty(navigator" not in html:
                  html = html.replace("<head>", "<head>\n" + hook_script)
                  with open(target_html, "w", encoding="utf-8") as f:
                      f.write(html)
                  print("✅ apps/pdfcraft-web/index.html 已注入中文浏览器重定向脚本")
          PYEOF

          python3 patch_chinese.py
          rm -f patch_chinese.py

      # 7. 预建产物目录并在根目录执行构建
      - name: Build Web Application
        env:
          CARGO_BUILD_JOBS: 2
        run: |
          mkdir -p dist/web
          trunk build apps/pdfcraft-web/index.html --release
          
          python3 - << 'EOF'
          import os, shutil, glob

          all_wasm = [p for p in glob.glob("**/*.wasm", recursive=True) if "target" not in p and "dist/web" not in p]
          print("发现编译产物路径:", all_wasm)
          
          if all_wasm:
              source_dir = os.path.dirname(all_wasm[0])
              print(f"定位到实际产物目录: {source_dir}，正在归拢到 dist/web/ ...")
              for item in os.listdir(source_dir):
                  src = os.path.join(source_dir, item)
                  dst = os.path.join("dist/web", item)
                  if os.path.isdir(src):
                      shutil.copytree(src, dst, dirs_exist_ok=True)
                  else:
                      shutil.copy2(src, dst)
              print("✅ 产物已成功归拢到 dist/web/")
          EOF

          echo "=== 检查初步构建产物 ==="
          ls -lh dist/web/

      # 8. 深度压缩 wasm 并通过纯原生 Fetch 还原分片
      - name: Compress Wasm & Handle 25MB Cloudflare Limit
        run: |
          echo "=== 开始对所有 wasm 进行极致压缩与切片检测 ==="
          cat << 'PYEOF' > split_wasm.py
          import os, glob, subprocess, json

          wasm_files = glob.glob("dist/web/**/*.wasm", recursive=True)
          if not wasm_files:
              wasm_files = glob.glob("dist/**/*.wasm", recursive=True)
          
          if not wasm_files:
              print("No wasm found in dist")
              exit(1)

          for wasm_path in wasm_files:
              wasm_dir = os.path.dirname(wasm_path)
              wasm_filename = os.path.basename(wasm_path)
              print(f"\n--- Processing: {wasm_filename} ---")
              
              cmd = [
                  "/usr/local/bin/wasm-opt-raw",
                  "--all-features",
                  "--enable-simd",
                  "-Oz",
                  "--converge",
                  "--strip-debug",
                  "--strip-producers",
                  wasm_path,
                  "-o",
                  wasm_path
              ]
              try:
                  subprocess.run(cmd, check=True)
                  print(f"Optimized size: {os.path.getsize(wasm_path)/(1024*1024):.2f} MB")
              except Exception as e:
                  print(f"wasm-opt error: {e}")

              size_mb = os.path.getsize(wasm_path) / (1024 * 1024)
              if size_mb > 24.0:
                  print(f"Wasm size exceeds 24MB ({size_mb:.2f} MB), splitting chunks...")
                  chunk_size = 15 * 1024 * 1024
                  with open(wasm_path, "rb") as f:
                      data = f.read()

                  chunks = []
                  for i in range(0, len(data), chunk_size):
                      part_name = f"{wasm_filename}.part{len(chunks)}"
                      part_path = os.path.join(wasm_dir, part_name)
                      with open(part_path, "wb") as pf:
                          pf.write(data[i:i+chunk_size])
                      chunks.append(part_name)
                      print(f"  Generated part: {part_name}")

                  os.remove(wasm_path)

                  html_path = os.path.join(wasm_dir, "index.html")
                  if os.path.exists(html_path):
                      with open(html_path, "r", encoding="utf-8") as f:
                          html = f.read()

                      parts_json_str = json.dumps(chunks)
                      
                      js_lines = [
                          "<script>",
                          "(function() {",
                          "  var origFetch = window.fetch;",
                          '  var targetWasm = "' + wasm_filename + '";',
                          "  var parts = " + parts_json_str + ";",
                          "  window.fetch = async function() {",
                          "    var args = Array.prototype.slice.call(arguments);",
                          "    var url = typeof args[0] === 'string' ? args[0] : (args[0] && args[0].url ? args[0].url : '');",
                          "    if (url.indexOf(targetWasm) !== -1) {",
                          "      console.log('[ChunkLoader] Fetching and merging wasm parts...');",
                          "      var basePath = url.substring(0, url.lastIndexOf('/') + 1);",
                          "      var buffers = await Promise.all(parts.map(function(p) {",
                          "        return origFetch(basePath + p).then(function(r) {",
                          "          if (!r.ok) throw new Error('Part failed: ' + p);",
                          "          return r.arrayBuffer();",
                          "        });",
                          "      }));",
                          "      var total = buffers.reduce(function(acc, b) { return acc + b.byteLength; }, 0);",
                          "      var merged = new Uint8Array(total);",
                          "      var offset = 0;",
                          "      for (var i = 0; i < buffers.length; i++) {",
                          "        merged.set(new Uint8Array(buffers[i]), offset);",
                          "        offset += buffers[i].byteLength;",
                          "      }",
                          "      return new Response(merged, { headers: { 'Content-Type': 'application/wasm' } });",
                          "    }",
                          "    return origFetch.apply(this, args);",
                          "  };",
                          "})();",
                          "</script>"
                      ]
                      transparent_loader = "\n".join(js_lines)

                      if "<head>" in html:
                          html = html.replace("<head>", "<head>\n" + transparent_loader)
                      else:
                          html = transparent_loader + "\n" + html

                      with open(html_path, "w", encoding="utf-8") as f:
                          f.write(html)
                      print(f"Transparent chunk loader injected into {html_path}")
              else:
                  print("Wasm size safe (<= 24MB), no splitting needed.")
          PYEOF

          python3 split_wasm.py
          rm -f split_wasm.py

          echo "=== 最终提交部署的文件列表 ==="
          ls -lh dist/web/

      # 9. 部署发布到 Cloudflare Pages (lotelf-pdf)
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/web --project-name=lotelf-pdf --branch=main --commit-dirty=true
