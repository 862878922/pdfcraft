name: Deploy PdfCraft to Cloudflare Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. 扩容 10GB 虚拟内存，避免 OOM 闪退 (Exit code 143)
      - name: Expand Swap Space (Fix OOM Exit Code 143)
        run: |
          echo "=== 扩容前内存状况 ==="
          free -h
          sudo swapoff -a || true
          sudo fallocate -l 10G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=10240
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo "=== 扩容后内存状况 ==="
          free -h

      # 2. 安装 Rust 工具链与 Wasm 目标平台
      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # 3. Rust 依赖与编译缓存加速
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v0-rust"

      # 4. 安装兼容版 Trunk
      - name: Install Trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.20.3

      # 5. 安装现代 Binaryen (wasm-opt v122) 并创建 SIMD Wrapper
      - name: Install Modern Binaryen & Setup SIMD Wrapper
        run: |
          curl -fsSL https://github.com/WebAssembly/binaryen/releases/download/version_122/binaryen-version_122-x86_64-linux.tar.gz | tar -xz
          sudo cp binaryen-version_122/bin/* /usr/local/bin/
          
          sudo mv /usr/local/bin/wasm-opt /usr/local/bin/wasm-opt-raw
          printf '#!/bin/bash\nexec /usr/local/bin/wasm-opt-raw --all-features --enable-simd "$@"\n' | sudo tee /usr/local/bin/wasm-opt > /dev/null
          sudo chmod +x /usr/local/bin/wasm-opt
          wasm-opt --version

      # 6. 配置 craft-i18n 官方中文词库并激活注册
      - name: Prepare craft-i18n Catalogs and Register Chinese
        run: |
          find . -name "Trunk.toml" -exec sed -i 's/wasm_opt = true/wasm_opt = false/g' {} + || true
          find . -name "Trunk.toml" -exec sed -i 's/wasm_opt = "z"/wasm_opt = false/g' {} + || true
          find . -name "*.html" -exec sed -i 's/data-wasm-opt="z"/data-wasm-opt="0"/g' {} + || true

          # 1. 克隆官方 craft-i18n 词库仓库，同步中文词条
          git clone --depth 1 https://github.com/storytold/craft-i18n.git "$GITHUB_WORKSPACE/craft-i18n"
          cp -r "$GITHUB_WORKSPACE/craft-i18n/locales/zh-hans" "$GITHUB_WORKSPACE/craft-i18n/locales/zh"

          cat << 'PYEOF' > setup_chinese_i18n.py
          import os, re

          # 1. 配置 Cargo.toml 最小体积 Profile
          cargo_file = "Cargo.toml"
          if os.path.exists(cargo_file):
              with open(cargo_file, "r", encoding="utf-8") as f:
                  content = f.read()
              new_profile = """[profile.release]
          opt-level = "z"
          lto = "fat"
          codegen-units = 1
          panic = "abort"
          strip = true
          debug = 0

          """
              content = re.sub(r'\[profile\.release\][^\[]+', new_profile, content)
              with open(cargo_file, "w", encoding="utf-8") as f:
                  f.write(content)
              print("✅ Cargo.toml Fat LTO 配置完成")

          # 2. 在 crates/ui-egui/src/i18n.rs 中激活中文
          i18n_rs = "crates/ui-egui/src/i18n.rs"
          if os.path.exists(i18n_rs):
              with open(i18n_rs, "r", encoding="utf-8") as f:
                  code = f.read()
              if '("en", false)' in code and '("zh", false)' not in code:
                  code = code.replace('("en", false)', '("zh", false),\n    ("zh-hans", false),\n    ("en", false)')
              if '"en" => "English"' in code and '"zh" =>' not in code:
                  code = code.replace('"en" => "English"', '"zh" => "Simplified Chinese",\n        "zh-hans" => "Simplified Chinese",\n        "en" => "English"')
              with open(i18n_rs, "w", encoding="utf-8") as f:
                  f.write(code)

          # 3. 设置默认偏好语言为中文
          for root, _, files in os.walk("crates"):
              for file in files:
                  if file.endswith(".rs"):
                      path = os.path.join(root, file)
                      try:
                          with open(path, "r", encoding="utf-8") as f:
                              c = f.read()
                          orig = c
                          c = c.replace('language: String = "system".into()', 'language: String = "zh".into()')
                          c = c.replace('const ENGLISH_ID: &str = "en";', 'const ENGLISH_ID: &str = "zh";')
                          if c != orig:
                              with open(path, "w", encoding="utf-8") as f:
                                  f.write(c)
                      except Exception:
                          pass

          # 4. 锁定浏览器默认语言为中文
          target_html = "apps/pdfcraft-web/index.html"
          if os.path.exists(target_html):
              with open(target_html, "r", encoding="utf-8") as f:
                  html = f.read()
              hook_script = (
                  "<script>\n"
                  "try {\n"
                  "  Object.defineProperty(navigator, 'language', { get: function() { return 'zh-CN'; } });\n"
                  "  Object.defineProperty(navigator, 'languages', { get: function() { return ['zh-CN', 'zh']; } });\n"
                  "  ['pdfcraft_language', 'language', 'locale', 'app_lang'].forEach(function(k) { localStorage.setItem(k, 'zh'); });\n"
                  "} catch(e) {}\n"
                  "</script>\n"
              )
              if "<head>" in html and "Object.defineProperty(navigator" not in html:
                  html = html.replace("<head>", "<head>\n" + hook_script)
                  with open(target_html, "w", encoding="utf-8") as f:
                      f.write(html)
          PYEOF
          python3 setup_chinese_i18n.py
          rm -f setup_chinese_i18n.py

      # 7. 构建 Web 应用程序
      - name: Build Web Application
        env:
          CARGO_BUILD_JOBS: 2
          CRAFT_I18N_DIR: ${{ github.workspace }}/craft-i18n
        run: |
          mkdir -p dist/web
          trunk build apps/pdfcraft-web/index.html --release
          
          python3 - << 'EOF'
          import os, shutil, glob
          all_wasm = [p for p in glob.glob("**/*.wasm", recursive=True) if "target" not in p and "dist/web" not in p]
          if all_wasm:
              source_dir = os.path.dirname(all_wasm[0])
              for item in os.listdir(source_dir):
                  src = os.path.join(source_dir, item)
                  dst = os.path.join("dist/web", item)
                  if os.path.isdir(src):
                      shutil.copytree(src, dst, dirs_exist_ok=True)
                  else:
                      shutil.copy2(src, dst)
              print("✅ 产物已同步至 dist/web/")
          EOF
          ls -lh dist/web/

      # 8. 单文件 Gzip 物理预压缩 + 注入流式解压 + CacheStorage 本地极速秒开 + 50ms 原生工作台拟真首屏
      - name: Optimize Wasm, Inject CacheStorage & Instant App Shell
        run: |
          python3 - << 'EOF'
          import os, glob, subprocess, gzip, re

          wasm_files = glob.glob("dist/web/**/*.wasm", recursive=True)
          if not wasm_files:
              wasm_files = glob.glob("dist/**/*.wasm", recursive=True)

          if not wasm_files:
              print("❌ 未找到 wasm 文件")
              exit(1)

          wasm_path = wasm_files[0]
          wasm_dir = os.path.dirname(wasm_path)
          wasm_filename = os.path.basename(wasm_path)

          print(f"原始 WASM 文件: {wasm_filename}，当前大小: {os.path.getsize(wasm_path)/(1024*1024):.2f} MB")

          # 1. 深度 wasm-opt 极致瘦身
          cmd = [
              "/usr/local/bin/wasm-opt-raw",
              "--all-features",
              "--enable-simd",
              "-Oz",
              "--strip-debug",
              "--strip-producers",
              wasm_path,
              "-o",
              wasm_path
          ]
          try:
              subprocess.run(cmd, check=True)
              print(f"wasm-opt 深度瘦身后大小: {os.path.getsize(wasm_path)/(1024*1024):.2f} MB")
          except Exception as e:
              print(f"wasm-opt 跳过: {e}")

          # 2. 单文件 Gzip 物理预压缩 (.wasm.gz)
          gz_filename = wasm_filename + ".gz"
          gz_path = os.path.join(wasm_dir, gz_filename)

          with open(wasm_path, 'rb') as f_in, gzip.open(gz_path, 'wb', compresslevel=9) as f_out:
              f_out.write(f_in.read())

          gz_size_mb = os.path.getsize(gz_path) / (1024 * 1024)
          print(f"✅ Gzip 预压缩完成: {gz_filename}，压缩后体积仅为: {gz_size_mb:.2f} MB (远低于 25MB 限制)")

          # 3. 删除超过 25MB 的原始未压缩 wasm 文件
          os.remove(wasm_path)
          print(f"✅ 已移除原始超大 wasm 文件，仅保留合规单文件: {gz_filename}")

          # 4. 在 index.html 中注入原生流式解压 + CacheStorage 本地秒级持久化缓存加载器
          html_path = os.path.join(wasm_dir, "index.html")
          if os.path.exists(html_path):
              with open(html_path, "r", encoding="utf-8") as f:
                  html = f.read()

              fast_loader = f"""<script>
          (function() {{
            var origFetch = window.fetch;
            var targetWasm = "{wasm_filename}";
            var gzFile = "{gz_filename}";
            var CACHE_NAME = 'pdfcraft-cache-v1';

            window.fetch = async function() {{
              var args = Array.prototype.slice.call(arguments);
              var url = typeof args[0] === 'string' ? args[0] : (args[0] && args[0].url ? args[0].url : '');
              if (url.indexOf(targetWasm) !== -1) {{
                var basePath = url.substring(0, url.lastIndexOf('/') + 1);
                var gzUrl = basePath + gzFile;

                // 优先从 CacheStorage 极速读取
                if ('caches' in window) {{
                  try {{
                    var cache = await caches.open(CACHE_NAME);
                    var cachedResp = await cache.match(gzUrl);
                    if (cachedResp) {{
                      console.log('[FastLoader] 命中本地 CacheStorage 缓存，极速秒开！');
                      var p = document.getElementById('shell-step-desc');
                      if (p) p.innerText = '正在从本地超高速缓存载入...';
                      var decomp = cachedResp.body.pipeThrough(new DecompressionStream('gzip'));
                      return new Response(decomp, {{ headers: {{ 'Content-Type': 'application/wasm' }} }});
                    }}
                  }} catch(e) {{
                    console.warn('[FastLoader] 读取本地缓存失败，降级网络拉取:', e);
                  }}
                }}

                console.log('[FastLoader] 正在网络拉取 Gzip 压缩包并流式极速解压: ' + gzFile);
                var resp = await origFetch(gzUrl);
                if (!resp.ok) throw new Error('WASM 压缩包下载失败: ' + gzFile);

                // 异步存入本地缓存，下次访问秒开
                if ('caches' in window) {{
                  try {{
                    var cacheToSave = await caches.open(CACHE_NAME);
                    cacheToSave.put(gzUrl, resp.clone());
                  }} catch(e) {{}}
                }}

                if (typeof DecompressionStream === 'function') {{
                  var decompressed = resp.body.pipeThrough(new DecompressionStream('gzip'));
                  return new Response(decompressed, {{ headers: {{ 'Content-Type': 'application/wasm' }} }});
                }} else {{
                  var buf = await resp.arrayBuffer();
                  return new Response(buf, {{ headers: {{ 'Content-Type': 'application/wasm' }} }});
                }}
              }}
              return origFetch.apply(this, args);
            }};
          }})();
          </script>"""

              if "<head>" in html:
                  html = html.replace("<head>", "<head>\n" + fast_loader)
              else:
                  html = fast_loader + "\n" + html

              # 移除旧的 wasm preload 标签避免 404
              html = re.sub(r'<link rel="preload" [^>]*\.wasm[^>]*>', '', html)

              # 5. 注入 50ms 拟真原生工作台首屏 (Instant App Shell) + 时间差操作捕获
              app_shell_dom = """
              <!-- [Instant App Shell] 50ms 极速拟真首屏 -->
              <div id="pdfcraft-app-shell" style="position:fixed;top:0;left:0;width:100vw;height:100vh;background-color:#1e2229;color:#e2e8f0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;z-index:999999;display:flex;flex-direction:column;user-select:none;">
                <!-- 顶栏模拟 -->
                <div style="height:40px;background:#181b20;display:flex;align-items:center;padding:0 12px;border-bottom:1px solid #2d333b;font-size:13px;justify-content:space-between;">
                  <div style="display:flex;align-items:center;gap:12px;">
                    <span style="font-weight:600;color:#ef4444;display:flex;align-items:center;gap:6px;">
                      📑 PDFCraft 文档阅读与编辑
                    </span>
                    <span style="color:#4b5563;">|</span>
                    <span style="color:#94a3b8;cursor:pointer;">文件</span>
                    <span style="color:#94a3b8;cursor:pointer;">编辑</span>
                    <span style="color:#94a3b8;cursor:pointer;">页面</span>
                    <span style="color:#94a3b8;cursor:pointer;">标注</span>
                    <span style="color:#94a3b8;cursor:pointer;">签名</span>
                    <span style="color:#94a3b8;cursor:pointer;">帮助</span>
                  </div>
                  <div id="engine-status-tag" style="font-size:12px;color:#94a3b8;display:flex;align-items:center;gap:6px;background:#242933;padding:3px 10px;border-radius:12px;border:1px solid #374151;">
                    <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#eab308;animation:pulse 1.5s infinite;"></span>
                    <span id="engine-status-text">PDF 渲染引擎就绪中...</span>
                  </div>
                </div>

                <!-- 主工作区模拟 -->
                <div style="flex:1;display:flex;position:relative;background:#131519;">
                  <!-- 左侧专业工具栏 -->
                  <div style="width:48px;background:#181b20;border-right:1px solid #2d333b;display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:16px;color:#64748b;font-size:16px;">
                    <div title="选择工具" style="cursor:pointer;color:#ef4444;">⤹</div>
                    <div title="手形平移" style="cursor:pointer;">✋</div>
                    <div title="高亮荧光笔" style="cursor:pointer;">🖍</div>
                    <div title="自由画笔" style="cursor:pointer;">✏</div>
                    <div title="便签批注" style="cursor:pointer;">📝</div>
                    <div title="页面管理" style="cursor:pointer;">📑</div>
                  </div>

                  <!-- 中间文档页面阅读区与欢迎引导卡片 -->
                  <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;">
                    <!-- 拟真 A4 文档纸张阴影背景 -->
                    <div style="position:absolute;width:580px;height:780px;background:#1e2229;border:1px solid #2d333b;border-radius:4px;box-shadow:0 8px 32px rgba(0,0,0,0.6);opacity:0.35;"></div>

                    <!-- 欢迎引导中心卡片 -->
                    <div style="position:relative;background:rgba(24,27,32,0.95);border:1px solid #374151;border-radius:8px;padding:28px 36px;box-shadow:0 16px 40px rgba(0,0,0,0.6);text-align:center;max-width:440px;width:90%;backdrop-filter:blur(6px);">
                      <div style="font-size:20px;font-weight:600;margin-bottom:8px;color:#f8fafc;">欢迎使用 PDFCraft</div>
                      <div style="font-size:13px;color:#94a3b8;margin-bottom:24px;">轻量、免安装的高性能 Web PDF 阅读与编辑工作台</div>
                      
                      <div style="display:flex;flex-direction:column;gap:10px;">
                        <label style="background:#dc2626;color:#fff;padding:10px 18px;border-radius:6px;font-size:14px;cursor:pointer;font-weight:500;transition:background 0.2s;display:flex;align-items:center;justify-content:center;gap:8px;">
                          📂 打开本地 PDF 文件
                          <input type="file" id="shell-file-input" accept=".pdf" style="display:none;" />
                        </label>
                        <button id="shell-new-btn" style="background:#262a33;color:#e2e8f0;border:1px solid #3b4252;padding:9px 18px;border-radius:6px;font-size:14px;cursor:pointer;font-weight:500;">
                          ➕ 新建空白 PDF 页面
                        </button>
                        <button id="shell-demo-btn" style="background:transparent;color:#ef4444;border:none;padding:6px;font-size:13px;cursor:pointer;">
                          📄 浏览官方示例 PDF 文档
                        </button>
                      </div>

                      <!-- 进度条提示 -->
                      <div style="margin-top:24px;border-top:1px solid #2d333b;padding-top:16px;">
                        <div style="display:flex;justify-content:space-between;font-size:12px;color:#64748b;margin-bottom:6px;">
                          <span id="shell-step-desc">正在拉取文档核心引擎...</span>
                          <span id="shell-progress-num">0%</span>
                        </div>
                        <div style="width:100%;height:4px;background:#2d333b;border-radius:2px;overflow:hidden;">
                          <div id="shell-progress-bar" style="width:18%;height:100%;background:#ef4444;transition:width 0.3s ease;"></div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
              <style>
              @keyframes pulse {
                0%, 100% { opacity: 1; transform: scale(1); }
                50% { opacity: 0.4; transform: scale(0.85); }
              }
              </style>
              <script>
              // 时间差操作捕获
              window._pdfcraft_stashed_file = null;
              window._pdfcraft_action = null;

              document.getElementById('shell-file-input').addEventListener('change', function(e) {
                if (e.target.files && e.target.files[0]) {
                  window._pdfcraft_stashed_file = e.target.files[0];
                  document.getElementById('shell-step-desc').innerText = "已选择: " + e.target.files[0].name + " (等待引擎启动)";
                }
              });
              document.getElementById('shell-new-btn').addEventListener('click', function() {
                window._pdfcraft_action = 'new';
                document.getElementById('shell-step-desc').innerText = "正在为您初始化空白 PDF 页面...";
              });
              document.getElementById('shell-demo-btn').addEventListener('click', function() {
                window._pdfcraft_action = 'demo';
                document.getElementById('shell-step-desc').innerText = "正在拉取示例 PDF 文档...";
              });

              // 核心启动完成后无缝平滑淡出
              window.addEventListener('TrunkApplicationStarted', function() {
                var shell = document.getElementById('pdfcraft-app-shell');
                if (shell) {
                  document.getElementById('engine-status-text').innerText = "核心已就绪";
                  document.getElementById('shell-progress-bar').style.width = "100%";
                  document.getElementById('shell-progress-num').innerText = "100%";
                  setTimeout(function() {
                    shell.style.transition = 'opacity 0.4s ease';
                    shell.style.opacity = '0';
                    setTimeout(function() { shell.remove(); }, 400);
                  }, 150);
                }
              });
              </script>
              """

              if "pdfcraft-app-shell" not in html:
                  html = html.replace("<body", app_shell_dom + "\n<body")
                  print("✅ 已成功将原生工作台首屏注入到 dist/web/index.html")

              with open(html_path, "w", encoding="utf-8") as f:
                  f.write(html)

          # 6. 注入 Cloudflare Pages _headers 1 年长效缓存头
          headers_path = os.path.join(wasm_dir, "_headers")
          headers_content = """/*
            Access-Control-Allow-Origin: *

          /*.wasm.gz
            Cache-Control: public, max-age=31536000, immutable
            Content-Type: application/gzip

          /*.wasm
            Cache-Control: public, max-age=31536000, immutable
            Content-Type: application/wasm

          /*.js
            Cache-Control: public, max-age=31536000, immutable

          /*.css
            Cache-Control: public, max-age=31536000, immutable
          """
          with open(headers_path, "w", encoding="utf-8") as f:
              f.write(headers_content)
          print("✅ 已生成 _headers 1 年长效缓存策略")
          EOF

          echo "=== 最终提交部署的文件列表（纯单文件，无任何 .part 分片） ==="
          ls -lh dist/web/

      # 9. 部署发布到 Cloudflare Pages (lotelf-pdf)
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # 1. 自动从 Token 探测真实 Account ID
          ACCOUNTS_JSON=$(curl -s -X GET "https://api.cloudflare.com/client/v4/accounts" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          DETECTED_ID=$(echo "$ACCOUNTS_JSON" | jq -r '.result[0].id // empty')
          
          if [ -n "$DETECTED_ID" ] && [ "$DETECTED_ID" != "null" ]; then
            export CLOUDFLARE_ACCOUNT_ID="$DETECTED_ID"
          fi

          # 2. 安装 Wrangler
          npm install -g wrangler

          # 3. 发布到 Cloudflare Pages (带 5 次自动重试机制，对抗 503 抖动)
          MAX_RETRIES=5
          RETRY_COUNT=0
          SUCCESS=0

          until [ $RETRY_COUNT -ge $MAX_RETRIES ]; do
            echo "🚀 正在发布到 Cloudflare Pages (尝试 $((RETRY_COUNT+1))/$MAX_RETRIES)..."
            if wrangler pages deploy dist/web --project-name=lotelf-pdf --branch=main --commit-dirty=true; then
              echo "✅ Cloudflare Pages 发布成功！"
              SUCCESS=1
              break
            fi
            RETRY_COUNT=$((RETRY_COUNT+1))
            echo "⚠️ 遇到 Cloudflare API 波动或 503，等待 15 秒后进行第 $RETRY_COUNT 次重试..."
            sleep 15
          done

          if [ $SUCCESS -ne 1 ]; then
            echo "❌ 连续重试 $MAX_RETRIES 次后发布失败，请检查网络或 Cloudflare 状态。"
            exit 1
          fi
