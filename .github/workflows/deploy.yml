name: Deploy PdfCraft to Cloudflare Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. 扩容 10GB 虚拟内存，确保深度 Fat LTO 链接不被系统 OOM 终止
      - name: Expand Swap Space (Fix OOM Exit Code 143)
        run: |
          echo "=== 扩容前内存状况 ==="
          free -h
          sudo swapoff -a || true
          sudo fallocate -l 10G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=10240
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo "=== 扩容后内存状况 ==="
          free -h

      # 2. 安装 Rust 工具链与 Wasm 目标平台
      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # 3. Rust 依赖与编译缓存加速
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      # 4. 安装兼容版 Trunk
      - name: Install Trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.20.3

      # 5. 安装现代 Binaryen (wasm-opt v122) 并创建 SIMD Wrapper
      - name: Install Modern Binaryen & Setup SIMD Wrapper
        run: |
          curl -fsSL https://github.com/WebAssembly/binaryen/releases/download/version_122/binaryen-version_122-x86_64-linux.tar.gz | tar -xz
          sudo cp binaryen-version_122/bin/* /usr/local/bin/
          
          sudo mv /usr/local/bin/wasm-opt /usr/local/bin/wasm-opt-raw
          printf '#!/bin/bash\nexec /usr/local/bin/wasm-opt-raw --all-features --enable-simd "$@"\n' | sudo tee /usr/local/bin/wasm-opt > /dev/null
          sudo chmod +x /usr/local/bin/wasm-opt
          wasm-opt --version

      # 6. 配置 Fat LTO 极致体积压缩并注入默认中文
      - name: Optimize Profile and Set Chinese Default
        run: |
          find . -name "Trunk.toml" -exec sed -i 's/wasm_opt = true/wasm_opt = false/g' {} + || true
          find . -name "Trunk.toml" -exec sed -i 's/wasm_opt = "z"/wasm_opt = false/g' {} + || true
          find . -name "*.html" -exec sed -i 's/data-wasm-opt="z"/data-wasm-opt="0"/g' {} + || true

          cat << 'PYEOF' > patch_all.py
          import os, re

          # 1. 注入 Fat LTO 与 codegen-units=1 极致体积配置，直压进入 20MB 安全线
          cargo_file = "Cargo.toml"
          if os.path.exists(cargo_file):
              with open(cargo_file, "r", encoding="utf-8") as f:
                  lines = f.readlines()
              
              filtered = []
              skip = False
              for line in lines:
                  if line.strip().startswith("[profile.release"):
                      skip = True
                      continue
                  if skip and line.strip().startswith("["):
                      skip = False
                  if not skip:
                      filtered.append(line)

              opt_profile = (
                  "\n[profile.release]\n"
                  'opt-level = "z"\n'
                  'lto = "fat"\n'
                  "codegen-units = 1\n"
                  'panic = "abort"\n'
                  "strip = true\n"
                  "debug = 0\n"
              )
              filtered.append(opt_profile)

              with open(cargo_file, "w", encoding="utf-8") as f:
                  f.writelines(filtered)
              print("Cargo.toml configured with Fat LTO for extreme binary compression.")

          # 2. 扫描源码并将默认语言修改为中文
          for root, _, files in os.walk("crates"):
              for file in files:
                  if file.endswith(".rs"):
                      path = os.path.join(root, file)
                      try:
                          with open(path, "r", encoding="utf-8") as f:
                              code = f.read()
                          new_code = code
                          if "Language::English" in new_code:
                              for target in ["Language::Chinese", "Language::Zh", "Language::ZhHans", "Language::SimplifiedChinese"]:
                                  if target in code:
                                      new_code = new_code.replace("Language::English", target)
                                      break
                          new_code = re.sub(r'language:\s*String\s*=\s*"en"[^;]*;', 'language: String = "zh".into();', new_code)
                          new_code = re.sub(r'default_lang\s*=\s*"en"', 'default_lang = "zh"', new_code)
                          if new_code != code:
                              with open(path, "w", encoding="utf-8") as f:
                                  f.write(new_code)
                              print(f"Patched default language to Chinese in {path}")
                      except Exception:
                          pass

          # 3. 为 apps/pdfcraft-web/index.html 注入默认中文 localStorage
          target_html = "apps/pdfcraft-web/index.html"
          if os.path.exists(target_html):
              with open(target_html, "r", encoding="utf-8") as f:
                  html = f.read()
              script = (
                  "<script>\n"
                  "try {\n"
                  "  if (!localStorage.getItem('pdfcraft_language') && !localStorage.getItem('language')) {\n"
                  "    localStorage.setItem('pdfcraft_language', 'zh');\n"
                  "    localStorage.setItem('language', 'zh');\n"
                  "    localStorage.setItem('locale', 'zh');\n"
                  "  }\n"
                  "} catch(e) {}\n"
                  "</script>\n"
              )
              if "<head>" in html and "pdfcraft_language" not in html:
                  html = html.replace("<head>", "<head>\n" + script)
                  with open(target_html, "w", encoding="utf-8") as f:
                      f.write(html)
                  print("apps/pdfcraft-web/index.html injected with Chinese default script.")
          PYEOF

          python3 patch_all.py
          rm -f patch_all.py

      # 7. 预建产物目录并在根目录执行构建
      - name: Build Web Application
        env:
          CARGO_BUILD_JOBS: 2
        run: |
          mkdir -p dist/web
          trunk build apps/pdfcraft-web/index.html --release
          
          # 自动全局检索真实产物位置并完整同步到 dist/web/
          python3 - << 'EOF'
          import os, shutil, glob

          all_wasm = [p for p in glob.glob("**/*.wasm", recursive=True) if "target" not in p and "dist/web" not in p]
          print("发现编译产物路径:", all_wasm)
          
          if all_wasm:
              source_dir = os.path.dirname(all_wasm[0])
              print(f"定位到实际产物目录: {source_dir}，正在归拢到 dist/web/ ...")
              for item in os.listdir(source_dir):
                  src = os.path.join(source_dir, item)
                  dst = os.path.join("dist/web", item)
                  if os.path.isdir(src):
                      shutil.copytree(src, dst, dirs_exist_ok=True)
                  else:
                      shutil.copy2(src, dst)
              print("✅ 产物已成功归拢到 dist/web/")
          EOF

          echo "=== 检查初步构建产物 ==="
          ls -lh dist/web/

      # 8. 深度压缩 wasm 并通过透明 Fetch 拦截器处理分片（彻底解决黑屏加载问题）
      - name: Compress Wasm & Handle 25MB Cloudflare Limit
        run: |
          echo "=== 开始对所有 wasm 进行极致压缩与切片检测 ==="
          cat << 'PYEOF' > split_wasm.py
          import os, glob, re, subprocess

          wasm_files = glob.glob("dist/web/**/*.wasm", recursive=True)
          if not wasm_files:
              wasm_files = glob.glob("dist/**/*.wasm", recursive=True)
          
          if not wasm_files:
              print("No wasm found in dist")
              exit(1)

          for wasm_path in wasm_files:
              wasm_dir = os.path.dirname(wasm_path)
              wasm_filename = os.path.basename(wasm_path)
              print(f"\n--- Processing: {wasm_filename} ---")
              
              # 1. 深度优化瘦身（带 --all-features 与 -Oz 极致压榨）
              cmd = [
                  "/usr/local/bin/wasm-opt-raw",
                  "--all-features",
                  "--enable-simd",
                  "-Oz",
                  "--converge",
                  "--strip-debug",
                  "--strip-producers",
                  wasm_path,
                  "-o",
                  wasm_path
              ]
              try:
                  subprocess.run(cmd, check=True)
                  print(f"Optimized size: {os.path.getsize(wasm_path)/(1024*1024):.2f} MB")
              except Exception as e:
                  print(f"wasm-opt error: {e}")

              # 2. 检查体积，如果依然大于 24MB，则采用透明 Fetch 劫持合并（不改动 Trunk 任何 JS 执行逻辑）
              size_mb = os.path.getsize(wasm_path) / (1024 * 1024)
              if size_mb > 24.0:
                  print(f"⚠️ {wasm_filename} 体积大于 24MB ({size_mb:.2f} MB)，启动无损透明分片...")
                  chunk_size = 15 * 1024 * 1024
                  with open(wasm_path, "rb") as f:
                      data = f.read()

                  chunks = []
                  for i in range(0, len(data), chunk_size):
                      part_name = f"{wasm_filename}.part{len(chunks)}"
                      part_path = os.path.join(wasm_dir, part_name)
                      with open(part_path, "wb") as pf:
                          pf.write(data[i:i+chunk_size])
                      chunks.append(part_name)
                      print(f"  已生成分片: {part_name}")

                  # 移除超出大小的原始文件
                  os.remove(wasm_path)

                  html_path = os.path.join(wasm_dir, "index.html")
                  if os.path.exists(html_path):
                      with open(html_path, "r", encoding="utf-8") as f:
                          html = f.read()

                      # 核心修复：通过重写全局 fetch，当 Trunk 请求该 wasm 文件时，透明在内存组装返回 Response
                      parts_json = str(chunks)
                      transparent_loader = f"""
<script>
  (function() {{
    const originalFetch = window.fetch;
    const targetWasm = "{wasm_filename}";
    const parts = {parts_json};

    window.fetch = async function(...args) {{
      const url = typeof args[0] === 'string' ? args[0] : (args[0] && args[0].url ? args[0].url : '');
      if (url.includes(targetWasm)) {{
        console.log('[ChunkLoader] 正在并发加载 Wasm 分片并还原...');
        const basePath = url.substring(0, url.lastIndexOf('/') + 1);
        const buffers = await Promise.all(parts.map(p => originalFetch(basePath + p).then(r => {{
          if (!r.ok) throw new Error("加载分片失败: " + p);
          return r.arrayBuffer();
        }})));
        const total = buffers.reduce((acc, b) => acc + b.byteLength, 0);
        const merged = new Uint8Array(total);
        let offset = 0;
        for (const b of buffers) {{
          merged.set(new Uint8Array(b), offset);
          offset += b.byteLength;
        }}
        return new Response(merged, {{
          headers: {{ 'Content-Type': 'application/wasm' }}
        }});
      }}
      return originalFetch.apply(this, args);
    }};
  }})();
</script>
"""
                      # 插入到 <head> 顶部，确保在任何 Trunk/Wasm 脚本运行前完成拦截
                      if "<head>" in html:
                          html = html.replace("<head>", "<head>\n" + transparent_loader)
                      else:
                          html = transparent_loader + html

                      with open(html_path, "w", encoding="utf-8") as f:
                          f.write(html)
                      print(f"✅ 已向 {html_path} 注入透明分片网络还原器")
              else:
                  print(f"✅ {wasm_filename} 体积安全 (<= 24MB)，无需切片")
          PYEOF

          python3 split_wasm.py
          rm -f split_wasm.py

          echo "=== 最终提交部署的文件列表 ==="
          ls -lh dist/web/

      # 9. 部署发布到 Cloudflare Pages (lotelf-pdf)
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/web --project-name=lotelf-pdf --branch=main --commit-dirty=true
