name: Deploy PdfCraft to Cloudflare Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. 扩容 10GB 虚拟内存，避免 OOM 闪退 (Exit code 143)
      - name: Expand Swap Space (Fix OOM Exit Code 143)
        run: |
          echo "=== 扩容前内存状况 ==="
          free -h
          sudo swapoff -a || true
          sudo fallocate -l 10G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=10240
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo "=== 扩容后内存状况 ==="
          free -h

      # 2. 安装 Rust 工具链与 Wasm 目标平台
      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # 3. Rust 依赖与编译缓存加速
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      # 4. 安装兼容版 Trunk (锁定 v0.20.3，避免 v0.22 的 workspace 破坏性变更)
      - name: Install Trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.20.3

      # 5. 安装现代 Binaryen (wasm-opt v122)
      - name: Install Modern Binaryen (wasm-opt v122)
        run: |
          curl -fsSL https://github.com/WebAssembly/binaryen/releases/download/version_122/binaryen-version_122-x86_64-linux.tar.gz | tar -xz
          sudo cp binaryen-version_122/bin/* /usr/local/bin/
          wasm-opt --version

      # 6. 配置体积压缩、修复 Trunk 目标 crate 映射并设置默认中文
      - name: Optimize Profile and Set Chinese Default
        run: |
          # 禁用 Trunk 内置 wasm-opt，避免多重调用
          if [ -f "Trunk.toml" ]; then
            sed -i 's/wasm_opt = true/wasm_opt = false/g' Trunk.toml || true
            sed -i 's/wasm_opt = "z"/wasm_opt = false/g' Trunk.toml || true
          fi
          if [ -f "index.html" ]; then
            sed -i 's/data-wasm-opt="z"/data-wasm-opt="0"/g' index.html || true
          fi

          cat << 'PYEOF' > patch_all.py
          import os, re

          # 1. 修复 index.html 中 trunk 的 crate 声明 (解决 could not find the root package 报错)
          for html_file in ["index.html", "crates/pdfcraft/index.html"]:
              if os.path.exists(html_file):
                  with open(html_file, "r", encoding="utf-8") as f:
                      html_content = f.read()
                  
                  # 显式声明 data-package="pdfcraft"
                  if 'data-trunk rel="rust"' in html_content and 'data-package' not in html_content:
                      html_content = html_content.replace('data-trunk rel="rust"', 'data-trunk rel="rust" data-package="pdfcraft"')
                      with open(html_file, "w", encoding="utf-8") as f:
                          f.write(html_content)
                      print(f"✅ 已在 {html_file} 中注入 data-package='pdfcraft'")

          # 2. 安全追加/替换 release profile，保证不损坏 workspace 配置
          cargo_file = "Cargo.toml"
          if os.path.exists(cargo_file):
              with open(cargo_file, "r", encoding="utf-8") as f:
                  lines = f.readlines()
              
              filtered = []
              skip = False
              for line in lines:
                  if line.strip().startswith("[profile.release"):
                      skip = True
                      continue
                  if skip and line.strip().startswith("["):
                      skip = False
                  if not skip:
                      filtered.append(line)

              opt_profile = (
                  "\n[profile.release]\n"
                  'opt-level = "z"\n'
                  'lto = "thin"\n'
                  "codegen-units = 16\n"
                  'panic = "abort"\n'
                  "strip = true\n"
                  "debug = 0\n"
              )
              filtered.append(opt_profile)

              with open(cargo_file, "w", encoding="utf-8") as f:
                  f.writelines(filtered)
              print("✅ Cargo.toml 优化配置更新完成")

          # 3. 扫描源码并将默认语言修改为中文
          for root, _, files in os.walk("crates"):
              for file in files:
                  if file.endswith(".rs"):
                      path = os.path.join(root, file)
                      try:
                          with open(path, "r", encoding="utf-8") as f:
                              code = f.read()
                          new_code = code
                          if "Language::English" in new_code:
                              for target in ["Language::Chinese", "Language::Zh", "Language::ZhHans", "Language::SimplifiedChinese"]:
                                  if target in code:
                                      new_code = new_code.replace("Language::English", target)
                                      break
                          new_code = re.sub(r'language:\s*String\s*=\s*"en"[^;]*;', 'language: String = "zh".into();', new_code)
                          new_code = re.sub(r'default_lang\s*=\s*"en"', 'default_lang = "zh"', new_code)
                          if new_code != code:
                              with open(path, "w", encoding="utf-8") as f:
                                  f.write(new_code)
                              print(f"Patched default language to Chinese in {path}")
                      except Exception:
                          pass

          # 4. 前端 index.html 注入默认中文 localStorage
          if os.path.exists("index.html"):
              with open("index.html", "r", encoding="utf-8") as f:
                  html = f.read()
              script = (
                  "<script>\n"
                  "try {\n"
                  "  if (!localStorage.getItem('pdfcraft_language') && !localStorage.getItem('language')) {\n"
                  "    localStorage.setItem('pdfcraft_language', 'zh');\n"
                  "    localStorage.setItem('language', 'zh');\n"
                  "    localStorage.setItem('locale', 'zh');\n"
                  "  }\n"
                  "} catch(e) {}\n"
                  "</script>\n"
              )
              if "<head>" in html and "pdfcraft_language" not in html:
                  html = html.replace("<head>", "<head>\n" + script)
                  with open("index.html", "w", encoding="utf-8") as f:
                      f.write(html)
                  print("✅ index.html 注入默认中文存储成功")
          PYEOF

          python3 patch_all.py
          rm -f patch_all.py

      # 7. 构建 WebAssembly 产物
      - name: Build Web Application
        env:
          CARGO_BUILD_JOBS: 2
        run: |
          trunk build --release
          echo "=== 检查构建产物 ==="
          ls -lh dist/

      # 8. 深度压缩 wasm 并执行 24MB 自动切片防御
      - name: Compress Wasm & Handle 25MB Cloudflare Limit
        run: |
          WASM_FILE=$(ls dist/*_bg.wasm 2>/dev/null | head -n 1 || ls dist/*.wasm 2>/dev/null | head -n 1)
          if [ -z "$WASM_FILE" ]; then
            echo "❌ 未检测到编译出的 wasm 文件，检查 dist 目录内容："
            ls -lh dist/
            exit 1
          fi

          echo "压缩前大小: $(ls -lh "$WASM_FILE" | awk '{print $5}')"
          wasm-opt --all-features -Oz --strip-debug --strip-producers "$WASM_FILE" -o "$WASM_FILE" || true
          echo "压缩后大小: $(ls -lh "$WASM_FILE" | awk '{print $5}')"

          cat << 'PYEOF' > split_wasm.py
          import os, glob, re

          wasm_files = glob.glob("dist/*.wasm")
          if not wasm_files:
              print("No wasm found")
              exit(0)

          wasm_path = wasm_files[0]
          size_mb = os.path.getsize(wasm_path) / (1024 * 1024)
          print(f"Current wasm size: {size_mb:.2f} MB")

          if size_mb > 24.0:
              print("Wasm size exceeds 24MB, splitting chunks...")
              wasm_filename = os.path.basename(wasm_path)
              chunk_size = 15 * 1024 * 1024
              with open(wasm_path, "rb") as f:
                  data = f.read()

              chunks = []
              for i in range(0, len(data), chunk_size):
                  part_name = f"{wasm_filename}.part{len(chunks)}"
                  part_path = os.path.join("dist", part_name)
                  with open(part_path, "wb") as pf:
                      pf.write(data[i:i+chunk_size])
                  chunks.append(f"./{part_name}")
                  print(f"Generated part: {part_name}")

              os.remove(wasm_path)

              html_path = "dist/index.html"
              with open(html_path, "r", encoding="utf-8") as f:
                  html = f.read()

              chunk_urls_js = str(chunks)
              loader_js = (
                  "async function __loadWasmChunks() {\n"
                  f"  const parts = {chunk_urls_js};\n"
                  "  const buffers = await Promise.all(parts.map(p => fetch(p).then(r => {\n"
                  "    if (!r.ok) throw new Error('Chunk load failed: ' + p);\n"
                  "    return r.arrayBuffer();\n"
                  "  })));\n"
                  "  const total = buffers.reduce((acc, b) => acc + b.byteLength, 0);\n"
                  "  const out = new Uint8Array(total);\n"
                  "  let offset = 0;\n"
                  "  for (const b of buffers) {\n"
                  "    out.set(new Uint8Array(b), offset);\n"
                  "    offset += b.byteLength;\n"
                  "  }\n"
                  "  return out;\n"
                  "}\n"
                  "const wasm = await init({ module_or_path: await __loadWasmChunks() });"
              )

              html = re.sub(r'const wasm = await init\(\{[^}]+\}\);', loader_js, html)
              html = re.sub(r'<link rel="preload" [^>]*\.wasm[^>]*>', '', html)

              with open(html_path, "w", encoding="utf-8") as f:
                  f.write(html)
              print("Updated dist/index.html with chunk loader.")
          else:
              print("Wasm file size within safe limit (<= 24MB).")
          PYEOF

          python3 split_wasm.py
          rm -f split_wasm.py

          echo "=== 最终提交部署的文件列表 ==="
          ls -lh dist/

      # 9. 部署发布到 Cloudflare Pages
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=lotelf-pdf --branch=main --commit-dirty=true
